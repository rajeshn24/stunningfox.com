<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STUNNING FOX Fashion</title>
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #111, #333);
      color: #fff;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      font-size: 4em;
      letter-spacing: 4px;
      margin-bottom: 20px;

    }
    p {
      font-size: 1.4em;
      margin-bottom: 40px;
      color: #ccc;
    }
    .btn {
      background: #e91e63;
      color: #fff;
      padding: 14px 32px;
      border: none;
      border-radius: 30px;
      font-size: 1.2em;
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .btn:hover {
      background: #c2185b;
    }
    footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      font-size: 0.9em;
      color: #888;
